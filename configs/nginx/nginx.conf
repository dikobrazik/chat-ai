upstream uptime_upstream {
  server uptime-kuma:3001;
}

upstream nextjs_upstream {
  server frontend:3000;
}

upstream nestjs_upstream {
  server backend:80;
}

map $http_origin $s3_cors_origin {
  default "";
  "https://jonu.ru" $http_origin;
  "https://www.jonu.ru" $http_origin;
}

log_format s3_no_query '$remote_addr - [$time_local] '
  '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;

  server_name         jonu.ru www.jonu.ru;

  server_tokens off;

  return 301 https://$host$request_uri;
}

server {
  listen              8443 ssl;
  http2 on;
  server_name         jonu.ru www.jonu.ru;
  ssl_certificate     /etc/letsencrypt/live/jonu.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jonu.ru/privkey.pem;
  ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_ecdh_curve      secp384r1;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_stapling        on;
  ssl_stapling_verify on;
  resolver            8.8.8.8; # Google DNS server

  add_header Content-Security-Policy "default-src 'self';" always;

  location /shared {
    alias /var/tmp/shared-docker;
  }

  location / {
    set $frame_options '';
    if ($http_referer !~ '^https?:\/\/([^\/]+\.)?(jonu\.ru|webvisor\.com|metri[ck]a\.yandex\.(com|ru|by|com\.tr))\/'){
        set $frame_options 'SAMEORIGIN';
    }

    set $script_src "'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net";
    set $img_src "'self' https://mc.yandex.ru https://jonu.ru:9443";
    set $connect_src "'self' wss://mc.yandex.ru/solid.ws https://mc.yandex.ru https://oauth.yandex.ru https://accounts.google.com https://jonu.ru:9443";
    set $style_src "'self' 'unsafe-inline'";
    set $frame_src "'self' blob: https://mc.yandex.ru";
    set $frame_ancestors_src "'self' http://metrika.yandex.ru";
    set $child_src "'self' blob: https://mc.yandex.ru";

    add_header X-Frame-Options $frame_options;
    add_header Content-Security-Policy "default-src 'self'; script-src $script_src; img-src $img_src; connect-src $connect_src; style-src $style_src; frame-src $frame_src; child-src $child_src; frame-ancestors $frame_ancestors_src;" always;

    proxy_pass http://nextjs_upstream;

    proxy_set_header        Host            $host;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api {
    proxy_pass http://nestjs_upstream/api;

    proxy_set_header        Host            $host;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://uptime_upstream/;

    proxy_set_header        Host            $host;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
  }

}

server {
  listen              9443 ssl;
  http2 on;
  server_name         jonu.ru;
  ssl_certificate     /etc/letsencrypt/live/jonu.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/jonu.ru/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  server_tokens off;
  merge_slashes off;
  client_max_body_size 100m;
  modsecurity off;

  access_log /var/log/nginx/s3.access.log s3_no_query;

  location / {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $s3_upstream seaweedfs:8333;
    proxy_pass http://$s3_upstream$request_uri;
    proxy_http_version 1.1;

    # S3 signatures include the original Host, including :9443.
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $s3_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "ETag, Accept-Ranges, Content-Range" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
      return 204;
    }
  }
}
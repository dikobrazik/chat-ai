services:
    nginx:
        image: ghcr.io/dikobrazik/chat-ai-nginx-front:latest
        container_name: nginx
        environment:
            MODSEC_AUDIT_LOG: /var/log/modsec/audit.log
            MODSEC_DEBUG_LOG: /var/log/modsec/debug.log
            SSL_CERT: /etc/letsencrypt/live/jonu.ru/fullchain.pem
            SSL_CERT_KEY: /etc/letsencrypt/live/jonu.ru/privkey.pem
            MANUAL_MODE: 1
        ports:
            - '80:8080'
            - '443:8443'
            - '9443:9443'
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt
            - shared-volume:/var/tmp/shared-docker
            - ~/log/nginx:/var/log/nginx
            - ~/log/modsec:/var/log/modsec
        restart: always
        depends_on:
            frontend:
                condition: service_started
            backend:
                condition: service_started
            uptime-kuma:
                condition: service_started
            seaweedfs:
                condition: service_healthy

    frontend:
        image: ghcr.io/dikobrazik/chat-ai-front:latest
        container_name: frontend
        env_file:
            - ./frontend.env
        volumes:
            - next-images:/usr/app/.next/cache
        restart: always

    backend:
        image: ghcr.io/dikobrazik/chat-ai-api:latest
        container_name: backend
        volumes:
            - shared-volume:/var/tmp/shared-docker
        env_file:
            - ./backend.env
            - ./storage.env
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_SSL: 'false'
            S3_ENDPOINT: https://jonu.ru:9443
            S3_INTERNAL_ENDPOINT: http://seaweedfs:8333
            S3_FORCE_PATH_STYLE: 'true'
            S3_REGION: us-east-1
        depends_on:
            postgres:
                condition: service_healthy
            seaweedfs:
                condition: service_healthy
        restart: always

    seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env_file:
            - ./storage.env
        entrypoint: ['/bin/sh', '/usr/local/bin/seaweedfs-entrypoint.sh']
        volumes:
            - ./seaweedfs-entrypoint.sh:/usr/local/bin/seaweedfs-entrypoint.sh:ro
            - seaweedfs-data:/data
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    curl --fail --fail-early --silent --show-error --max-time 4
                    --aws-sigv4 aws:amz:us-east-1:s3
                    --user "$${S3_ACCESS_KEY_ID}:$${S3_SECRET_ACCESS_KEY}"
                    --head
                    "http://127.0.0.1:8333/$${USER_FILES_BUCKET_NAME}"
                    "http://127.0.0.1:8333/$${GENERATED_IMAGES_BUCKET_NAME}"
                    >/dev/null
            interval: 10s
            timeout: 10s
            retries: 12
            start_period: 20s
        stop_grace_period: 30s
        restart: unless-stopped

    postgres:
        image: postgres:18.6-alpine3.24
        container_name: postgres
        env_file:
            - ./backend.env
        ports:
            # Expose the PostgreSQL port to the host machine for local development
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    uptime-kuma:
        image: louislam/uptime-kuma:2
        container_name: uptime
        restart: unless-stopped
        volumes:
            - ./data:/var/tmp/uptime
        ports:
            - "3001:3001"
    dozzle:
        image: amir20/dozzle:latest
        container_name: dozzle
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
    shared-volume:
    postgres-data:
    next-images:
    seaweedfs-data:

services:
    nginx:
        image: ghcr.io/dikobrazik/chat-ai-nginx-front:latest
        container_name: nginx
        environment:
            MODSEC_AUDIT_LOG: /var/log/modsec/audit.log
            MODSEC_DEBUG_LOG: /var/log/modsec/debug.log
            SSL_CERT: /etc/letsencrypt/live/jonu.ru/fullchain.pem
            SSL_CERT_KEY: /etc/letsencrypt/live/jonu.ru/privkey.pem
            MANUAL_MODE: 1
        ports:
            - '80:8080'
            - '443:8443'
        volumes:
            - /etc/letsencrypt:/etc/letsencrypt
            - shared-volume:/var/tmp/shared-docker
            - ~/log/nginx:/var/log/nginx
            - ~/log/modsec:/var/log/modsec
        restart: always
        depends_on:
            - frontend
            - uptime-kuma

    frontend:
        image: ghcr.io/dikobrazik/chat-ai-front:latest
        container_name: frontend
        env_file:
            - ./frontend.env
        volumes:
            - /tmp/.next/cache:/usr/app/.next/cache
        restart: always

    backend:
        image: ghcr.io/dikobrazik/chat-ai-api:latest
        container_name: backend
        volumes:
            - shared-volume:/var/tmp/shared-docker
        env_file:
            - ./backend.env
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_SSL: 'false'
        depends_on:
            postgres:
                condition: service_healthy
        restart: always

    postgres:
        image: postgres:18.6-alpine3.24
        container_name: postgres
        env_file:
            - ./backend.env
        ports:
            # Expose the PostgreSQL port to the host machine for local development
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    uptime-kuma:
        image: louislam/uptime-kuma:2
        container_name: uptime
        restart: unless-stopped
        volumes:
            - ./data:/var/tmp/uptime
        ports:
            - "3001:3001"
    dozzle:
        image: amir20/dozzle:latest
        container_name: dozzle
        restart: unless-stopped
        ports:
            - "127.0.0.1:8081:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
    shared-volume:
    postgres-data:
    next-images:

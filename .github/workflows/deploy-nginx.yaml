name: Nginx deployment

on:
  push:
    branches: ["main"]
    paths: ["configs/nginx/**", "configs/deploy/docker-compose.yaml"]
  workflow_dispatch:

env:
  NGINX_IMAGE: ghcr.io/dikobrazik/chat-ai-nginx-front

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Nginx for together composing
        uses: docker/build-push-action@v5
        with:
          context: ./configs/nginx
          file: ./configs/nginx/Dockerfile
          push: true
          tags: ${{ env.NGINX_IMAGE }}

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deployment config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.ID_RSA }}
          source: "configs/deploy/docker-compose.yaml"
          target: "/home/github/chat-ai"
          strip_components: 2

      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          key: ${{ secrets.ID_RSA }}
          script: |
            cd /home/github/chat-ai &&
            docker login -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} ghcr.io &&
            docker compose stop nginx &&
            docker compose pull nginx &&
            docker compose up -d nginx &&
            docker system prune -f

  notify:
    needs: [deploy]
    if: always()
    uses: ./.github/workflows/telegram-notify.yaml
    with:
      status: ${{ needs.deploy.result }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
